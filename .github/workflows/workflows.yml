name: Build and Lint Code

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-lint:
    name: Build and Lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl3 libssl-dev openssl build-essential
          sudo ln -s /usr/lib/*/libssl.so.3 /usr/lib/libssl.so.3 || true
          sudo ln -s /usr/lib/*/libcrypto.so.3 /usr/lib/libcrypto.so.3 || true

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: |
          echo "Generating Prisma client..."
          LD_LIBRARY_PATH=/usr/lib:/usr/local/lib:$LD_LIBRARY_PATH bun prisma generate || {
            echo "❌ Prisma client generation failed."
            exit 1
          }

      - name: Lint code
        run: |
          echo "Running ESLint..."
          bun run lint || {
            echo "❌ Linting failed. Please fix the linting errors before merging."
            exit 1
          }

      - name: Type check
        run: |
          echo "Running TypeScript checks..."
          bun run build-ts || {
            echo "❌ TypeScript type check failed. Please fix the type errors before merging."
            exit 1
          }

      - name: Build production bundle
        run: |
          echo "Building production bundle..."
          bun run build-prod || {
            echo "❌ Production build failed. Please fix the build errors before merging."
            exit 1
          }

      - name: Summary
        if: always()
        run: |
          echo "### Build and Lint Results" >> $GITHUB_STEP_SUMMARY
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ All checks passed successfully!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some checks failed. See details above." >> $GITHUB_STEP_SUMMARY
          fi
